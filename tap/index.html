<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rad Dad</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#020810">
    <meta http-equiv="refresh" content="0; url=/qr/">
    <link rel="canonical" href="https://raddadband.com/qr/">
    <script>
        const destination = new URL('/qr/', window.location.origin);
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.toString());
    </script>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #020810;
            color: #f5f1e8;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            text-align: center;
        }

        a {
            color: #00a8f3;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <p>Taking you to Rad Dad.</p>
        <a href="/qr/">Continue to the music</a>
    </main>
</body>
</html>
