name: Temporary evergreen audit snapshot
on:
  push:
    branches: [update/evergreen-band-homepage]
    paths: [.github/workflows/evergreen-audit-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Snapshot tracked source and locked test dependencies only
        run: |
          mkdir -p /tmp/raddad-audit
          git archive --format=tar.gz HEAD > /tmp/raddad-audit/source.tar.gz
          git rev-parse HEAD > /tmp/raddad-audit/source-sha.txt
          npm ci --ignore-scripts
          tar -czf /tmp/raddad-audit/test-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evergreen-audit-source
          path: /tmp/raddad-audit/
          retention-days: 1
          if-no-files-found: error
